name: uptime

# Runs only on its own timer or by hand. No pull_request trigger, so nobody
# outside can make it run. No secrets, no checkout, no third-party actions.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: summitintegrations.com HQ healthz
        if: always()
        run: |
          # Three tries, 20 s apart, so one slow answer is not an alert.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://summitintegrations.com/hq/healthz || true)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::summitintegrations.com/hq/healthz failed 3 times"
          exit 1
      - name: summitintegrations.com home
        if: always()
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://summitintegrations.com/ || true)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::summitintegrations.com/ failed 3 times"
          exit 1
      - name: summitclient.com home
        if: always()
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://summitclient.com/ || true)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::summitclient.com/ failed 3 times"
          exit 1
